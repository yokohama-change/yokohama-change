name: Apply YOKOHAMA CHANGE Runtime Now

on:
  push:
    paths:
      - ".github/workflows/apply_v2_runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore verified classifier and run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Refresh Yokohama data
        run: |
          python scripts/collect.py
          python scripts/enrich_status.py

      - name: Clean Python cache
        run: |
          find . -type f -name '*.pyc' -delete
          find . -type d -name '__pycache__' -empty -delete || true

      - name: Save refreshed data
        run: |
          git config user.name "yokohama-change-bot"
          git config user.email "yokohama-change-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: refresh conservative deadline statuses"
            git push
          fi
