name: Apply YOKOHAMA CHANGE v2 Runtime Guard

on:
  push:
    paths:
      - ".github/workflows/apply_v2_runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install persistent v2 guard
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path

          root = Path(".")
          v2 = root / "scripts" / "enrich_status_v2.py"
          live = root / "scripts" / "enrich_status.py"
          v2.parent.mkdir(parents=True, exist_ok=True)
          v2.write_bytes(base64.b64decode(''))
          live.write_bytes(v2.read_bytes())

          collect = root / "scripts" / "collect.py"
          text = collect.read_text(encoding="utf-8")
          marker = "# YOKOHAMA_CHANGE_STATUS_V2_GUARD"
          if marker not in text:
              needle = "from __future__ import annotations\n"
              guard = """
# YOKOHAMA_CHANGE_STATUS_V2_GUARD
from pathlib import Path as _YCPath
_yc_status_v2 = _YCPath(__file__).with_name("enrich_status_v2.py")
_yc_status_live = _YCPath(__file__).with_name("enrich_status.py")
if _yc_status_v2.exists():
    _yc_status_payload = _yc_status_v2.read_bytes()
    if not _yc_status_live.exists() or _yc_status_live.read_bytes() != _yc_status_payload:
        _yc_status_live.write_bytes(_yc_status_payload)
# /YOKOHAMA_CHANGE_STATUS_V2_GUARD

"""
              if needle not in text:
                  raise SystemExit("collect.py future import marker not found")
              text = text.replace(needle, needle + guard, 1)
              collect.write_text(text, encoding="utf-8")
              print("patched collect.py with persistent v2 restore guard")
          else:
              print("collect.py guard already installed")
          PY

      - name: Verify v2 deadline logic
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import date
          from pathlib import Path

          p = Path("scripts/enrich_status.py")
          spec = importlib.util.spec_from_file_location("status_enrichment", p)
          s = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(s)

          def check(text, title, expected_status, expected_deadline):
              item = {"title": title, "source_updated": "Tue, 21 Jul 2026 08:00:00 GMT"}
              facts = s.extract_facts(text, item, date(2026, 8, 14))
              out = s.classify_status(facts, date(2026, 8, 14))
              assert out["application_status"] == expected_status, (title, out)
              assert out["participation_deadline"] == expected_deadline, (title, out)

          check(
              """ヒアリング実施日 2026年9月1日
          申込について
          提出書類 参加意向申出書（第１号様式）
          提出期間 令和８年７月28日(火曜日)17時まで（必着）
          申込期限
          2026年7月28日
          関連資料について
          質問書 提出期限 令和８年８月６日17時まで""",
              "Live！横浜2027", "資格者のみ進行中", "2026-07-28"
          )

          check(
              """申込について
          提出書類 参加意向申出書（様式１）１部
          提出期間 令和８年８月４日(火曜日)午後５時まで（必着）
          申込期限
          関連資料について
          質問書の提出
          提出期限 令和８年８月19日（水曜日）午後５時まで（必着）""",
              "次世代型太陽電池", "資格者のみ進行中", "2026-08-04"
          )

          check(
              """入札開始日 2026年8月24日
          申込について
          提出書類 公募型指名競争入札参加意向申出書
          提出期間 2026年８月７日午後５時まで
          申込期限
          2026年8月7日
          指名・非指名通知日 2026年８月19日まで""",
              "学習動画", "資格者のみ進行中", "2026-08-07"
          )

          facts = s.extract_facts(
              "ヒアリング実施日 2026年9月1日 提案書提出期限 2026年8月30日",
              {"title": "曖昧案件", "source_updated": "Tue, 21 Jul 2026 08:00:00 GMT"},
              date(2026, 8, 14),
          )
          out = s.classify_status(facts, date(2026, 8, 14))
          assert out["application_status"] == "判定不可", out
          assert out["is_open_now"] is None, out

          print("verified v2 conservative deadline logic")
          PY

      - name: Run existing tests
        run: |
          python -m unittest discover -s tests -v

      - name: Refresh Yokohama data with v2
        run: |
          python scripts/collect.py
          python scripts/enrich_status.py

      - name: Clean Python cache
        run: |
          find . -type f -name '*.pyc' -delete
          find . -type d -name '__pycache__' -empty -delete || true

      - name: Save v2 runtime guard and refreshed data
        run: |
          git config user.name "yokohama-change-bot"
          git config user.email "yokohama-change-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix: persist conservative deadline v2 runtime"
            git push
          fi
