name: YOKOHAMA CHANGE Auto

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
      - "config/**"
      - "scripts/**"
      - "tests/**"
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: yokohama-change-auto
  cancel-in-progress: true

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync to latest main
        run: |
          git fetch origin main
          git checkout -B main origin/main
          echo "SYNC_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v

      - name: Seed newly added official sources as baseline
        run: |
          python scripts/seed_new_sources.py

      - name: Collect Kanagawa public changes
        run: |
          python scripts/collect.py

      - name: Require all official sources healthy
        run: |
          python scripts/source_gate.py

      - name: Restore known opportunity candidates
        run: |
          python scripts/preserve_candidate_history.py

      - name: Normalize public latest view
        run: |
          python scripts/normalize_public.py

      - name: Enrich application status across approved official domains
        run: |
          python scripts/enrich_status_multi.py

      - name: Enrich active support periods
        run: |
          python scripts/enrich_support_periods.py

      - name: Regionalize public outputs
        run: |
          python scripts/regionalize_outputs_extended.py

      - name: Collect gBizINFO sales signals
        env:
          GBIZINFO_API_TOKEN: ${{ secrets.GBIZINFO_API_TOKEN }}
        run: |
          python scripts/collect_gbiz.py

      - name: Validate public outputs
        run: |
          python scripts/quality_gate.py

      - name: Require explainable open-status evidence
        run: |
          python scripts/explainability_gate.py

      - name: Generate crawlable opportunity pages
        run: |
          python scripts/generate_opportunity_pages_multi.py

      - name: Inject open-status verification traces
        run: |
          python scripts/inject_opportunity_trace.py

      - name: Generate regional SEO landing pages
        run: |
          python scripts/generate_region_pages_extended.py

      - name: Generate category SEO landing pages
        run: |
          python scripts/generate_category_pages.py

      - name: Generate focus SEO landing pages
        run: |
          python scripts/generate_focus_pages.py

      - name: Clean Python cache
        run: |
          find . -type f -name '*.pyc' -delete
          find . -type d -name '__pycache__' -empty -delete || true

      - name: Save changes automatically
        run: |
          git config user.name "yokohama-change-bot"
          git config user.email "yokohama-change-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "auto: refresh YOKOHAMA CHANGE"

          if git push origin HEAD:main; then
            exit 0
          fi

          echo "Push did not fast-forward; checking whether main advanced during this run..."
          git fetch origin main
          REMOTE_SHA=$(git rev-parse origin/main)
          if [ "$REMOTE_SHA" != "$SYNC_BASE_SHA" ]; then
            echo "main advanced from $SYNC_BASE_SHA to $REMOTE_SHA. Refusing to merge generated snapshots; a newer run or the next schedule will refresh safely."
            exit 0
          fi

          echo "Push failed even though main did not advance; treating this as a real write failure."
          exit 1
