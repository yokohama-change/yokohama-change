name: YOKOHAMA CHANGE Auto

on:
  push:
    paths:
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write

concurrency:
  group: yokohama-change-auto
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install project from ZIP
        run: |
          if [ -f yokohama-change-ready.zip ]; then
            unzip -o yokohama-change-ready.zip -d temp
            cp -a temp/japan-change-zero/. .
            rm -rf temp

            # GitHub Actionsから別のworkflowを作ると拒否されるため除外
            rm -f .github/workflows/collect.yml

            rm -f yokohama-change-ready.zip
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests -v
          fi

      - name: Collect public changes
        run: |
          if [ -f scripts/collect.py ]; then
            python scripts/collect.py
          fi

      - name: Save changes automatically
        run: |
          git config user.name "yokohama-change-bot"
          git config user.email "yokohama-change-bot@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "auto: update YOKOHAMA CHANGE"
            git push
          fi
